<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=760, initial-scale=1">
<title>Báo cáo công việc</title>
<style>
  :root{
    --bg:#0f172a; --card:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
    --brand1:#4f46e5; --brand2:#7c3aed;
    --done:#16a34a; --doing:#d97706; --blocked:#dc2626; --new:#2563eb;
    --done-bg:#dcfce7; --doing-bg:#fef3c7; --blocked-bg:#fee2e2; --new-bg:#dbeafe;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;
       padding:28px;color:var(--ink);-webkit-font-smoothing:antialiased}
  .card{width:760px;margin:0 auto;background:var(--card);border-radius:20px;overflow:hidden;
        box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .header{background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#fff;padding:28px 32px}
  .header h1{font-size:24px;font-weight:700;letter-spacing:.2px}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
        border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
  .body{padding:20px 32px 28px}
  .item{display:flex;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .item:last-child{border-bottom:none}
  .item .main{flex:1;min-width:0}
  .item .title{font-size:15.5px;font-weight:700;line-height:1.4;color:var(--ink)}
  .item .note{margin-top:3px;font-size:13px;color:var(--muted);line-height:1.5}
  .bar{margin-top:9px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px}
  .bar-fill.done{background:var(--done)}
  .bar-fill.doing{background:var(--doing)}
  .bar-fill.blocked{background:var(--blocked)}
  .bar-fill.new{background:var(--new)}
  .meta{display:flex;flex-direction:column;align-items:flex-end;gap:7px;white-space:nowrap;min-width:78px}
  .pct{font-size:15px;font-weight:800;color:var(--ink)}
  .badge{white-space:nowrap;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px}
  .badge.done{color:var(--done);background:var(--done-bg)}
  .badge.doing{color:var(--doing);background:var(--doing-bg)}
  .badge.blocked{color:var(--blocked);background:var(--blocked-bg)}
  .badge.new{color:var(--new);background:var(--new-bg)}
  .badge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
                 background:currentColor;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <!--DATA-START: header — h1 "Báo cáo ngày dd/mm/yyyy" + summary chips. NO emoji (font không render trong chrome sidecar). -->
      <h1>Báo cáo ngày 06/06/2026</h1>
      <div class="summary">
        <span class="chip">4 hoàn thành</span>
        <span class="chip">3 đang làm</span>
      </div>
      <!--DATA-END: header -->
    </div>

    <div class="body">
      <!--DATA-START: items — flat .item list (KHÔNG nhóm project); class ∈ {done,doing,blocked,new} -->
      <div class="item">
        <div class="main">
          <div class="title">Tên công việc chuẩn hóa</div>
          <div class="note">Chi tiết việc đã làm trong session.</div>
          <div class="bar"><div class="bar-fill doing" style="width:60%"></div></div>
        </div>
        <div class="meta">
          <span class="pct">60%</span>
          <span class="badge doing">Đang làm</span>
        </div>
      </div>
      <!--DATA-END: items -->
    </div>

  </div>
</body>
</html>
