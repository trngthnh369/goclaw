# Base docker-compose — shared service definition.
# Pre-built images: ghcr.io/nextlevelbuilder/goclaw (also on Docker Hub: digitop/goclaw)
#
# The default `latest` image includes an embedded web dashboard (no separate nginx needed).
# Web UI is served at the same port as the API (default: 18790).
#
# Quick start:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#   # Dashboard: http://localhost:18790
#
# Optional nginx (for custom SSL, reverse proxy, caching):
#   make up WITH_WEB_NGINX=1
#   # or: docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.selfservice.yml up -d
#   # Dashboard via nginx: http://localhost:3000
#
# Docker image variants:
#   latest       — Backend + embedded web UI + Python (recommended)
#   latest-base  — Backend API-only, no web UI, no runtimes
#   latest-full  — All runtimes + skill dependencies pre-installed
#   latest-otel  — Latest + OpenTelemetry tracing
#
# With OTel tracing:  add -f docker-compose.otel.yml
# With Claude CLI:    add -f docker-compose.claude-cli.yml

services:
  goclaw:
    image: ghcr.io/nextlevelbuilder/goclaw:v3.14.0
    build:
      context: ${GOCLAW_DIR:-.}
      dockerfile: Dockerfile
      args:
        ENABLE_OTEL: "${ENABLE_OTEL:-false}"
        ENABLE_EMBEDUI: "${ENABLE_EMBEDUI:-true}"  # set to false when using WITH_WEB_NGINX
        ENABLE_PYTHON: "${ENABLE_PYTHON:-true}"
        ENABLE_FULL_SKILLS: "${ENABLE_FULL_SKILLS:-false}"
        VERSION: "${GOCLAW_VERSION:-dev}"
    # Uncomment to test update UI: GOCLAW_VERSION=v1.0.0
    ports:
      - "${GOCLAW_BIND:-127.0.0.1}:${GOCLAW_PORT:-18790}:18790"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - path: .env
        required: false
    environment:
      - GOCLAW_HOST=0.0.0.0
      - GOCLAW_PORT=18790
      - GOCLAW_CONFIG=/app/data/config.json
      - GOCLAW_GATEWAY_TOKEN=${GOCLAW_GATEWAY_TOKEN:-}
      - GOCLAW_ENCRYPTION_KEY=${GOCLAW_ENCRYPTION_KEY:-}
      - GOCLAW_SKILLS_DIR=/app/data/skills
      # Owner IDs (comma-separated) — users with full admin access
      - GOCLAW_OWNER_IDS=${GOCLAW_OWNER_IDS:-trngthnh369}
      # Remote server management (Webmin API)
      - REMOTE_HOST=${REMOTE_HOST:-}
      - REMOTE_WEBMIN_USER=${REMOTE_WEBMIN_USER:-}
      - REMOTE_WEBMIN_PASS=${REMOTE_WEBMIN_PASS:-}
      - REMOTE_GOCLAW_PORT=${REMOTE_GOCLAW_PORT:-18790}
      - REMOTE_GOCLAW_TOKEN=${REMOTE_GOCLAW_TOKEN:-}
      # Force Go to use CGO DNS resolver (respects /etc/hosts over Docker DNS)
      - GODEBUG=netdns=cgo
      # Lane concurrency — restored to higher defaults since all agents use
      # Gemini API HTTP (not subprocess), so concurrency is limited by HTTP only.
      - GOCLAW_LANE_MAIN=${GOCLAW_LANE_MAIN:-10}
      - GOCLAW_LANE_SUBAGENT=${GOCLAW_LANE_SUBAGENT:-10}
      - GOCLAW_LANE_TEAM=${GOCLAW_LANE_TEAM:-10}
      - GOCLAW_LANE_CRON=${GOCLAW_LANE_CRON:-5}
      # Debug
      - GOCLAW_TRACE_VERBOSE=${GOCLAW_TRACE_VERBOSE:-0}
    volumes:
      - goclaw-data:/app/data
      - goclaw-workspace:/app/workspace
      - ./skills:/app/data/skills
    # Disable IPv6 — Docker DNS returns IPv6 for googleapis.com but network is IPv4-only
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # DNS overrides for Docker IPv4-only networks
      - "gamma-api.polymarket.com:104.18.34.205"
      - "clob.polymarket.com:104.18.34.205"
      - "data-api.polymarket.com:104.18.34.205"
      - "strapi-matic.polymarket.com:104.18.34.205"
      - "generativelanguage.googleapis.com:142.250.199.234"
    security_opt:
      - no-new-privileges:true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '2.0'
          pids: 200
    networks:
      - default
      - goclaw-net
    restart: unless-stopped

volumes:
  goclaw-data:
  goclaw-workspace:

networks:
  goclaw-net:
    name: goclaw-net
    driver: bridge
