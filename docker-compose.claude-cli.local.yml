# Local override for the daily-report agent (GoClaw × Claude CLI × Zalo).
# Use this INSTEAD of docker-compose.claude-cli.yml. It:
#   - builds a THIN derived image (Dockerfile.claude-cli: prebuilt v3.14.0 + claude CLI),
#     so no slow from-source rebuild and the exact v3.14.0 binary is preserved
#   - mounts the WINDOWS host ~/.claude (Docker Desktop path) so the in-container `claude`
#     authenticates (entrypoint copies .credentials.json) AND can read projects/**/*.jsonl
#   - shares the goclaw-workspace volume into the Chrome sidecar so HTML render via
#     file:// works across containers (P4 in the plan)
#
# Requires the browser sidecar (defines the `chrome` service).
#
# Usage (build once, then up):
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.postgres.yml \
#     -f docker-compose.browser.yml \
#     -f docker-compose.claude-cli.local.yml \
#     up -d --build
#
# Verify after up:
#   docker compose ... exec goclaw ls /app/.claude-host/projects   # P2 mount
#   docker compose ... exec goclaw claude -p "ping"                # P1 auth
#
# ⚠️ MOUNT SOURCE: this host runs Docker Desktop (WSL2 backend) and compose is invoked
#    from Windows, so the bind source is the Windows path. Verified the user's Claude Code
#    sessions + .credentials.json live at C:\Users\truon\.claude. If your home differs,
#    edit `source` below. (Long-form bind avoids the C:\ colon being parsed as a separator.)

services:
  goclaw:
    image: goclaw-claude-cli:local
    build:
      context: .
      dockerfile: Dockerfile.claude-cli
    volumes:
      - type: bind
        source: "C:/Users/truon/.claude"
        target: /app/.claude-host
        read_only: true
      # Windows-host ~/.codex (ChatGPT OAuth tokens) — for GPT Image generation via the
      # codex subscription image_generation tool (no OpenAI API key needed).
      - type: bind
        source: "C:/Users/truon/.codex"
        target: /app/.codex-host
        read_only: true
      # Patched gateway binary, mounted instead of baked into the image.
      #
      # A binary pushed in with `docker cp` lives in the container's WRITABLE
      # LAYER, so it is silently discarded the moment the container is
      # recreated. That happened on 2026-08-06 at 02:04 (the daily host boot
      # window): the gateway reverted to the image's pre-P0 binary and ran the
      # 09:33 cron with the audit gate and every other fix missing. Nothing
      # surfaced it — the container looked healthy and the schema check passed.
      #
      # Bind-mounting keeps the binary on the host and in this compose file, so
      # it survives recreate and reboot, and adds no image layer (the from-source
      # image build crashes Docker Desktop at buildkit layer export on this host).
      #
      # Rebuild:  docker run --rm -e VERSION=v3.14.0 -v D:/Projects/personal/goclaw:/src \
      #             -v goclaw-out:/out -v goclaw-gocache:/root/.cache/go-build \
      #             -v goclaw-gomod:/go/pkg/mod -w /src golang:1.26-bookworm \
      #             sh /src/scripts/build-gateway-binary.sh
      #           then copy /out/goclaw to .deploy/goclaw and `docker restart goclaw-goclaw-1`.
      # Rollback: comment this mount out and `up -d goclaw` — the image binary returns.
      #
      # ⚠️ The source must exist as a FILE before `up`, or Docker creates a
      #    DIRECTORY at that path and the container fails to start.
      - type: bind
        source: "D:/Projects/personal/goclaw/.deploy/goclaw"
        target: /app/goclaw
        read_only: true

  chrome:
    # Shared read-only view of the agent workspace so the sidecar can open
    # file:///app/workspace/<agent>/daily-report/render/report.html written by GoClaw.
    volumes:
      - goclaw-workspace:/app/workspace:ro
